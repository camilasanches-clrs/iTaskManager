<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>itask Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>iTask</h1>
    </header>

    <main>
        <section id="new-task">
            <div class="campo-titulo" >
                <h2>Título:</h2>
                <input id="titulo" placeholder="Título">
            </div>

            <div class="campo-descricao">
                <h2>Descrição:</h2>
                <input id="descricao" placeholder="Descrição">
            </div>

            <div>
                <button id="adicionar" type="button">Adicionar</button>
            </div>
        </section>

        <section id="tasks">

        </section>
    </main>
    
</body>
</html>
